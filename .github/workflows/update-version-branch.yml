name: Update Version Branch

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  update-version-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Force-Push Changes to Latest Version Branch
        run: |
          set -o pipefail
          branch=$(jq -r '.version // empty' *.json | sort -Vu | tail -n 1 | tr -d '\r,\n')
          if [ -z "$branch" ]
          then
            echo "::error::No version found in any JSON file"
            exit 1
          fi
          git push -f origin "HEAD:refs/heads/$branch"
      - name: Trigger Flatpak Update Check
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: bwRavencl/ControllerBuddy-Flatpak
          event-type: new-release
